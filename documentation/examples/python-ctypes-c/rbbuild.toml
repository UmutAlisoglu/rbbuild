# rbbuild project configuration. See rbbuild.toml.md in the user manual.

[project]
name    = 'greet_ctypes'
version = '1.0'

# A platform-specific wheel: the compiled library is added to the Python
# package. Without platform-specific, rbbuild would tag the wheel as
# py3-none-any, i.e., installable on any platform.
[packaging.wheel]
type              = 'python'
platform-specific = true
files = [
    'greet_ctypes',
    {src = '$OBJ/libgreet.*', strip = '$OBJ/', dest = 'greet_ctypes'},
]
