[settings]
profile = 'standalone'


[paths]
user_config = '$HOME/.config/rbbuild'
source = '.'
# temp =   # auto-generated in /tmp/ or C:\temp\ if not defined

# Relative to source path
build_root = 'obj'
staging_root = 'staging'
documentation_root = 'obj'

# Downloaded files will be cached in this folder.
dist = '${RBB_DIST_PATH:$HOME/.cache/rbbuild/dist}'

[tool.rbbuild]
actions = ['setup', 'build']
build-tools = ['rbbuild', 'cmake', 'pypa', 'npm']
documentation-tools = []
sca-tools = ['ruff']

