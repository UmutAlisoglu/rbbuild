[profile.services.fake_artifactory]
type = 'local_file_service'
auth-method = 'none'
# $RBB_CONFIG_PATH is expanded at config load time. In a source checkout it is
# share/rbbuild/config, so this resolves to the repository's test/data.
url  = 'file:$RBB_CONFIG_PATH/../../../test/data'
