# rbbuild project configuration
#
# All sections in this file are optional. Detailed description is found in the user manual (rbbuild.toml.md).
# Uncomment sections and entries that apply to your project.

[project]
name    = 'custom_build_scripts'   # defaults to git repository name
version = '1.0'                    # set version prefix (it is also possible to set three or four digits)
# branch  = 'local'                # set a fixed branch name instead of deriving from git

# [dependencies]
# deps = [
# ]

# Uploads my_component as-is.
[packaging.mypackage_plain]
# type = 'plain'  # if unset, defaults to auto - detects whether plain or archive is chosen
files  = ['$OBJ/my_component']

[packaging.mypackage_archive]
type   = 'archive'
files  = ['$OBJ/my_component']
# suffix = 'zip'  # if unset, defaults to tar.xz archive type


[rbbuild]
build-scripts = ['custom_build_script.py']
# build-tools = ['rbbuild', 'cmake', 'pypa', 'npm']
# actions   = ['setup', 'build']
# documentation-tools = ['pandoc', 'sphinx']
# test-tools = ['ctest', 'pytest']
# sca-tools = ['ruff']

